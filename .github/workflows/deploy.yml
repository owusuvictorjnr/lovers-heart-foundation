# ─────────────────────────────────────────────────────────────────────────────
# CD: develop → staging, prod → production (manual approval required).
#
#   push ──► CI (reused) ──► migrate DB ──► build ──► deploy ──► smoke + security checks
#
# Secrets live in GitHub *Environments* ("staging", "production"), so a job can
# only read them when it targets that environment and its protection rules pass.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy

on:
  push:
    branches: [develop, prod]
  workflow_dispatch: # manual re-deploy of the current branch

permissions:
  contents: read

# Never run two deploys of the same environment at once; never cancel one mid-way
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  VERCEL_CLI_VERSION: "60.0.1"
  npm_config_ignore_scripts: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: CI
    if: github.ref_name == 'prod' || github.ref_name == 'develop'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      APP_ENV: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: "Guard: production only from prod"
        if: env.APP_ENV == 'production' && github.ref != 'refs/heads/prod'
        run: |
          echo "::error::Production deploys are only allowed from prod"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # Migrations run BEFORE the new code goes live, so they must be backward
      # compatible with the currently running version (expand → migrate → contract).
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      # Runtime secrets (Paystack, Cloudinary, AUTH_SECRET…) are stored in the Vercel
      # project, not in GitHub. Each environment has its own Vercel project.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify environment configuration
        run: node scripts/verify-deploy-env.mjs .vercel/.env.production.local "$APP_ENV"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Smoke & security checks
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/smoke-test.mjs "${SITE_URL:-${{ steps.deploy.outputs.url }}}"

      - name: Remove local Vercel credentials
        if: always()
        run: rm -rf .vercel